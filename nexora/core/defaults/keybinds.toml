# ============================================================
# Nexora Engine - Default Key Bindings
# ============================================================
#
# Base input actions shipped by Nexora.
# Project settings, mods and user settings can override these
# actions in later configuration layers.
# ============================================================

[move_up]
keyboard = ["w", "up"]

[move_down]
keyboard = ["s", "down"]

[move_left]
keyboard = ["a", "left"]

[move_right]
keyboard = ["d", "right"]

[jump]
keyboard = ["space"]

[interact]
keyboard = ["e"]

[attack]
mouse = ["left"]

[pause]
keyboard = ["escape"]

# In-game menu navigation. The GameMenu reads these semantic actions
# through InputManager; physical keys can be overridden by a project.
[menu_next_tab]
keyboard = ["tab"]

[menu_previous_tab]
keyboard = ["q"]

[menu_confirm]
keyboard = ["enter"]

[menu_back]
keyboard = ["backspace"]

[menu_up]
keyboard = ["up"]

[menu_down]
keyboard = ["down"]

[menu_left]
keyboard = ["left"]

[menu_right]
keyboard = ["right"]

[debug_overlay]
keyboard = ["f3"]

[physics_debug]
keyboard = ["f4"]

[debug_console]
keyboard = ["f10"]
