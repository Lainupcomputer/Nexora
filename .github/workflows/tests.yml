name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Windows / Python 3.13 No-GIL
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13t"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Nexora and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify No-GIL mode
        run: |
          python -Xgil=0 -c "import sys; print(sys.version); assert not sys._is_gil_enabled(), 'GIL is enabled'"

      - name: Run tests without GPU or audio
        run: python -Xgil=0 -m pytest -m "not gpu and not audio" -v --tb=short