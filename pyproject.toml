[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-engine"
version = "0.1.0"
description = "A modern 2D game engine built on pygame-ce"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }

dependencies = [
    "pygame-ce>=2.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
include = ["nexora*"]